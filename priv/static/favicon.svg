<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Fanfarr</title>
  <!-- A herald trumpet on the diagonal. The earlier horizontal version packed
       a bell, a body, a mouthpiece and three valves into 32px and collapsed
       into an indistinct blob at tab size; this is three shapes with clear
       negative space between them, which is what survives being shrunk to
       16px. Geometry is generated by scripts/generate-icons.py, which also
       derives favicon.ico and apple-touch-icon.png from this file.
       NB: no double hyphen anywhere in this comment. SVG is XML, and XML
       forbids it inside a comment; one makes the whole file unparseable and
       the browser shows a broken image. -->
  <g fill="#eab308">
    <!-- Tube, lower-left to upper-right -->
    <path d="M3.74 23.74 L15.24 12.24 L19.76 16.76 L8.26 28.26 z"/>
    <!-- Flared bell -->
    <path d="M15.24 12.24 L19.76 16.76 L29.95 11.95 L20.05 2.05 z"/>
    <!-- Mouthpiece -->
    <circle cx="5.6" cy="26.4" r="3.4"/>
  </g>
</svg>
