name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Skip image builds for changes that don't affect the software.
    # (Not evaluated for tag pushes — those always build.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".githooks/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Two pushes landing together would otherwise both read the same version and
# both try to bump to it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every build of main gets its own version number, so an image can be
  # referred to as 0.1.7 rather than sha-3f9a1c2. The bump happens before the
  # build, not after, so the image is tagged with the version it reports.
  #
  # No loop: a push made with GITHUB_TOKEN does not trigger workflows. That is
  # also why this cannot be a separate workflow reacting to the bump commit --
  # nothing would react to it.
  version:
    runs-on: ubuntu-latest
    # Only a real push to a branch bumps: a tag push is already a version, and
    # a manual dispatch is a rebuild of something that has one.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump the patch version
        id: bump
        # Through the environment, never interpolated into the script: a branch
        # name can contain shell metacharacters, and `${{ }}` inside a `run:`
        # block is how that becomes code. zizmor calls it template injection and
        # it is right -- this is the same rule as `System.cmd/3` over a shell
        # string, which this project already follows for yt-dlp.
        env:
          BRANCH: ${{ github.ref_name }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # `main` can move while this runs -- somebody pushing during a build
          # is ordinary -- and the push is then rejected, which fails the run
          # and means the image for that commit is quietly never built. It
          # happened: a notes commit landed mid-bump, the push was refused,
          # and the release had a tag and no image. So each attempt starts
          # from the current remote tip and bumps that, rather than bumping
          # once and hoping nothing moved underneath it.
          branch="$BRANCH"

          for attempt in 1 2 3; do
            git fetch origin "$branch" --quiet
            git reset --hard "origin/$branch" --quiet

            pattern='(?<=version: ")[0-9]+\.[0-9]+\.[0-9]+(?=")'
            current=$(grep -oP "$pattern" mix.exs)
            IFS=. read -r major minor patch <<< "$current"
            next="$major.$minor.$((patch + 1))"

            echo "attempt $attempt: $current -> $next"
            sed -i "0,/version: \"$current\"/s//version: \"$next\"/" mix.exs
            grep -q "version: \"$next\"" mix.exs

            git config user.name "github-actions[bot]"
            git config user.email "$BOT_EMAIL"
            git commit -am "chore: v$next"

            if git push origin "HEAD:$branch"; then
              echo "version=$next" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "push rejected -- $branch moved; retrying from the new tip"
            sleep 5
          done

          echo "could not bump the version after 3 attempts" >&2
          exit 1

  # One native runner per platform, rather than one runner building both under
  # emulation. ffmpeg is compiled from source here (see the Dockerfile), and a
  # from-source build under QEMU is five to ten times slower -- an hour or two
  # instead of fifteen minutes. GitHub's standard runners include arm64
  # (`ubuntu-24.04-arm`), and standard runners are free on public repositories,
  # so the honest comparison is: same wall-clock, double the (free) minutes.
  #
  # 64-bit only, deliberately. `hexpm/elixir` publishes amd64 and arm64 and
  # nothing else, so 32-bit ARM would mean changing the base image this whole
  # appliance is built on, for hardware Plex has largely left behind.
  #
  # Each platform is pushed by digest and assembled into a manifest list by the
  # merge job below. Pushing a tag from both jobs would have the second one
  # overwrite the first.
  build:
    needs: version
    # A tag push skips the bump job entirely; the build still has to run.
    if: always() && needs.version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The commit the bump produced, so the image contains the version it
          # is about to be tagged with.
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # The runner *is* the platform, so nothing is emulated.
          platforms: ${{ matrix.platform }}
          # By digest, not by tag: the merge job is what gives these names.
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_REF=${{ needs.version.outputs.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build metadata anyone can check rather than take on faith: an SBOM
          # listing what went into the image, and provenance describing how it
          # was built and from which commit. Two lines, and it is the
          # difference between "trust this image" and "here is what is in it".
          sbom: true
          provenance: true

      - name: Smoke test the published image
        # Catches the class of failure a build cannot: a release that compiles
        # but will not boot. This pulls the digest that was just published --
        # not a local build -- so it tests the artifact people will get, and on
        # this runner that artifact is this machine's architecture. The amd64
        # image was the only one ever booted before this; now both are.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Smoke testing $IMAGE on $(uname -m)"
          docker run -d --name fanfarr-smoke -p 7373:7373 \
            -v "$PWD/smoke-config:/config" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7373/health; then
              echo "\nHealthy after ${i}s"
              docker rm -f fanfarr-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Image failed to become healthy. Logs:"
          docker logs fanfarr-smoke
          exit 1

      - name: Export the digest
        # The prefix is stripped for the filename: `actions/upload-artifact`
        # rejects colons in paths, and a digest is `sha256:...`. The merge job
        # puts it back when it assembles the reference. This is the step that
        # failed the first multi-arch run -- the build and the smoke test on
        # both platforms had already passed.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The manifest list: one tag that resolves to whichever platform the machine
  # pulling it happens to be. Registry storage roughly doubles; what a user
  # downloads does not change at all, because they only ever receive their own
  # platform's layers.
  merge:
    needs: [version, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}

      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create the manifest list
        env:
          # Every tag the metadata action worked out for this ref, one per line.
          TAGS: ${{ steps.meta.outputs.tags }}
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          tag_args=$(echo "$TAGS" | sed 's/^/-t /')

          # shellcheck disable=SC2046
          docker buildx imagetools create $tag_args \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Show what was published
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            echo "=== $tag ==="
            # Not `| head`: under `set -o pipefail` that fails when head exits
            # first and docker takes SIGPIPE. That is how this step turned the
            # merge job red after it had already published a correct list.
            docker buildx imagetools inspect "$tag"
          done
