name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Skip image builds for changes that don't affect the software.
    # (Not evaluated for tag pushes — those always build.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".githooks/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Two pushes landing together would otherwise both read the same version and
# both try to bump to it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every build of main gets its own version number, so an image can be
  # referred to as 0.1.7 rather than sha-3f9a1c2. The bump happens before the
  # build, not after, so the image is tagged with the version it reports.
  #
  # No loop: a push made with GITHUB_TOKEN does not trigger workflows. That is
  # also why this cannot be a separate workflow reacting to the bump commit --
  # nothing would react to it.
  version:
    runs-on: ubuntu-latest
    # Only a real push to a branch bumps: a tag push is already a version, and
    # a manual dispatch is a rebuild of something that has one.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump the patch version
        id: bump
        run: |
          set -euo pipefail

          current=$(grep -oP '(?<=version: ")[0-9]+\.[0-9]+\.[0-9]+(?=")' mix.exs)
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"

          echo "$current -> $next"
          sed -i "0,/version: \"$current\"/s//version: \"$next\"/" mix.exs
          grep -q "version: \"$next\"" mix.exs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: v$next"
          git push origin HEAD:${{ github.ref_name }}

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: version
    # A tag push skips the bump job entirely; the build still has to run.
    if: always() && needs.version.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The commit the bump produced, so the image contains the version it
          # is about to be tagged with.
          ref: ${{ needs.version.outputs.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BUILD_REF=${{ needs.version.outputs.sha || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Catches the class of failure a build cannot: a release that compiles
        # but will not boot. Runs the real image, waits for the healthcheck to
        # report the app up and its database reachable, then tears it down.
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Smoke testing $IMAGE"
          docker run -d --name fanfarr-smoke -p 7373:7373 -v "$PWD/smoke-config:/config" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7373/health; then
              echo "\nHealthy after ${i}s"
              docker rm -f fanfarr-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Image failed to become healthy. Logs:"
          docker logs fanfarr-smoke
          docker rm -f fanfarr-smoke
          exit 1
