name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Skip image builds for changes that don't affect the software.
    # (Not evaluated for tag pushes — those always build.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
      - ".githooks/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        # Catches the class of failure a build cannot: a release that compiles
        # but will not boot. Runs the real image, waits for the healthcheck to
        # report the app up and its database reachable, then tears it down.
        run: |
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Smoke testing $IMAGE"
          docker run -d --name fanfarr-smoke -p 7373:7373 -v "$PWD/smoke-config:/config" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7373/health; then
              echo "\nHealthy after ${i}s"
              docker rm -f fanfarr-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Image failed to become healthy. Logs:"
          docker logs fanfarr-smoke
          docker rm -f fanfarr-smoke
          exit 1
