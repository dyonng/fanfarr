name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/release-notes/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ffmpeg is a runtime dependency, not a test convenience: the image
      # ships it, the apply pipeline cuts and normalises with it, and the
      # tests that exercise it are the ones that caught a cut which produced
      # a correctly-sized but completely silent file. Without this the suite
      # skips exactly the code most likely to be wrong -- so it is installed
      # rather than the tests being tagged around.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          # Read the same versions the Dockerfile and local dev use, so CI
          # cannot drift from what actually ships.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # Exits non-zero on a finding, so this gates rather than informs. Every
      # advisory this project has had was found by hand while doing something
      # else, and the last one sat open until someone happened to look. The
      # first run of this step found two: an advisory on `lazy_html` that was
      # test-only, and one on Ash itself hiding behind it.
      - name: Audit dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Tests
        run: mix test
