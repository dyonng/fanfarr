services:
  fanfarr:
    image: ghcr.io/dyonng/fanfarr:latest
    container_name: fanfarr
    restart: unless-stopped
    environment:
      # Ownership of files Fanfarr writes. Match these to the user that owns
      # your media library, or the theme.mp3 files it writes into the library
      # will be unreadable by Plex and unwritable by everything else.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}

      - PORT=${PORT:-7373}

      # Plex Media Server. Use the host IP if Plex runs on baremetal, or the
      # container name if it shares this network.
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}

      # Reverse proxy support. Leave unset when reaching Fanfarr directly by IP.
      # PHX_HOST/URL_SCHEME fix generated links; BASE_PATH is for hosting under
      # a subpath rather than its own hostname.
      - PHX_HOST=${PHX_HOST:-}
      - URL_SCHEME=${URL_SCHEME:-http}
      - BASE_PATH=${BASE_PATH:-}

      # Only needed when Plex and Fanfarr see the library at different paths.
      # Pairs of plex_prefix:local_prefix, separated by ; -- see
      # docs/deployment.md. Leave empty when the mounts above match Plex's.
      - PATH_MAPPINGS=${PATH_MAPPINGS:-}

      - LOG_LEVEL=${LOG_LEVEL:-info}
    # Cap Docker's capture of stdout so months of logs can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-7373}:${PORT:-7373}"
    volumes:
      # Database, generated secret, and cached posters.
      # Named ./appdata rather than ./config so it cannot be confused with the
      # application's own config/ directory -- they would otherwise collide in
      # the Docker build context.
      - ./appdata:/config

      # Media, mounted at the IDENTICAL path the host uses.
      #
      # Plex runs on bare metal here, so it reports host paths -- /media/... as
      # the host sees them. Mounting /media at /media makes Fanfarr's view match
      # Plex's exactly, so no translation is needed and PATH_MAPPINGS stays
      # empty. It also survives adding a library on a new drive later.
      #
      # :rslave is REQUIRED, not decorative. The mergerfs pools under
      # /media/merged-storage are separate mount points, and a plain bind mount
      # does not carry nested mounts through -- the container would see
      # /media/merged-storage as an empty directory, with no error and no clue
      # why the library looks empty. :rslave propagates them, and also means a
      # pool remounted on the host is picked up rather than going stale.
      - /media:/media:rslave
    networks:
      - media-stack

networks:
  media-stack:
    external: true
    name: media-stack
