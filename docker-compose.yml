services:
  fanfarr:
    image: ghcr.io/dyonng/fanfarr:latest
    container_name: fanfarr
    restart: unless-stopped
    environment:
      # Ownership of files Fanfarr writes. Match these to the user that owns
      # your media library, or the theme.mp3 files it writes into the library
      # will be unreadable by Plex and unwritable by everything else.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}

      - PORT=${PORT:-7373}

      # Plex Media Server. Use the host IP if Plex runs on baremetal, or the
      # container name if it shares this network.
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}

      # Reverse proxy support. Leave unset when reaching Fanfarr directly by IP.
      # PHX_HOST/URL_SCHEME fix generated links; BASE_PATH is for hosting under
      # a subpath rather than its own hostname.
      - PHX_HOST=${PHX_HOST:-}
      - URL_SCHEME=${URL_SCHEME:-http}
      - BASE_PATH=${BASE_PATH:-}

      # Only needed when Plex and Fanfarr see the library at different paths.
      # Pairs of plex_prefix:local_prefix, separated by ; -- see
      # docs/deployment.md. Leave empty when the mounts above match Plex's.
      - PATH_MAPPINGS=${PATH_MAPPINGS:-}

      - LOG_LEVEL=${LOG_LEVEL:-info}
    # Cap Docker's capture of stdout so months of logs can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-7373}:${PORT:-7373}"
    volumes:
      # Database, generated secret, and cached posters.
      - ./config:/config

      # Media library. Mount it at the SAME container path your Plex container
      # uses, and Fanfarr needs no further configuration -- add as many
      # libraries underneath as you like and it will find all of them.
      #
      # One shared root is deliberate. Enumerating each library here would mean
      # editing compose every time you add one; sharing a root means Plex is
      # the only place that knows what libraries exist.
      #
      # If the paths cannot match, set PATH_MAPPINGS instead of reshaping this.
      # For mergerfs, append :rslave -- see docs/deployment.md.
      - /mnt/storage:/data
    networks:
      - media-stack

networks:
  media-stack:
    external: true
    name: media-stack
