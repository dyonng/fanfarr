services:
  fanfarr:
    image: ghcr.io/dyonng/fanfarr:latest
    container_name: fanfarr
    restart: unless-stopped
    environment:
      # Ownership of files Fanfarr writes. Match these to the user that owns
      # your media, or the theme.mp3 files written into the library will be
      # unreadable by Plex and unwritable by everything else.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}

      - PORT=${PORT:-7373}

      # Dashboard login. Set both to require one; leave both unset and the
      # dashboard is OPEN to anyone who can reach the port, which is how the
      # *arrs also start. There is no sign-up page: this is the account, and
      # changing the password here and restarting is the whole story.
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}

      # Plex Media Server. Use host.docker.internal if Plex runs on bare metal,
      # or the container name if it shares this network.
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}

      # Only needed when a library is mounted somewhere Fanfarr cannot work out
      # from the root folders alone -- see docs/deployment.md. With the mounts
      # below configured as root folders, this stays empty.
      - PATH_MAPPINGS=${PATH_MAPPINGS:-}

      # Sends only yt-dlp through a proxy, leaving Plex and ThemerrDB direct.
      # Empty means no proxy, which is the recommended default: YouTube
      # bot-checks datacenter addresses far more aggressively than residential
      # ones. Read docs/deployment.md before routing this through a VPN.
      - YTDLP_PROXY=${YTDLP_PROXY:-}

      # Reverse proxy support. Leave unset when reaching Fanfarr by IP.
      - PHX_HOST=${PHX_HOST:-}
      - URL_SCHEME=${URL_SCHEME:-http}
      - BASE_PATH=${BASE_PATH:-}

      - LOG_LEVEL=${LOG_LEVEL:-info}
    # Cap Docker's capture of stdout so months of logs can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-7373}:${PORT:-7373}/tcp"
    volumes:
      # Database, generated secret, and cached posters.
      - /path/to/docker/fanfarr:/config

      # Media, mounted exactly as Sonarr and Radarr do it: one numbered mount
      # per library location, container paths of your choosing. Add as many as
      # you have -- there is no fixed number and no required naming.
      #
      # Register these same container paths as root folders in Settings.
      # Fanfarr locates an item by matching its directory name across the root
      # folders, so it does not need to be told which drive holds which show,
      # and it never needs the library mounted at Plex's own path.
      - /path/to/tv-drive-1:/tv1
      - /path/to/tv-drive-2:/tv2
      - /path/to/movie-drive-1:/movies1
      - /path/to/movie-drive-2:/movies2

      # Mounting a union filesystem (mergerfs, unionfs) rather than the drives
      # underneath it? Add :rslave, or the container sees an empty directory
      # where the pool should be, with no error to explain why:
      #   - /path/to/pool/TV:/tv:rslave
    extra_hosts:
      # Lets PLEX_URL be http://host.docker.internal:32400 when Plex runs on
      # the host rather than in a container.
      - host.docker.internal:host-gateway
    networks:
      - media-stack

networks:
  media-stack:
    external: true
    name: media-stack
